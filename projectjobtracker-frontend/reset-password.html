<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobTracker — Reset Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-wrap">

    <div class="boarding-pass">

        <div class="bp-header">
            <span class="bp-eyebrow">JOB TRACKER</span>
            <span class="bp-flight">PASSWORD RESET</span>
        </div>

        <div class="bp-body">

            <h1>Reset password</h1>

            <p class="bp-sub">
                Enter your new password below.
            </p>

            <form id="resetForm">

                <div class="field">

                    <label>New password</label>

                    <input
                        type="password"
                        id="passwordInput"
                        placeholder="Enter new password"
                        required
                    >

                </div>

                <div class="field">

                    <label>Confirm password</label>

                    <input
                        type="password"
                        id="confirmPasswordInput"
                        placeholder="Confirm new password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn-primary"
                    id="submitBtn"
                >
                    Reset password
                </button>

            </form>

            <p class="forgot-message" id="message"></p>

            <p class="switch-mode">
                <a href="index.html">← Back to sign in</a>
            </p>

        </div>

        <div class="bp-perforation"></div>

        <div class="bp-stub">

            <div class="stub-row">
                <span>GATE</span>
                <strong>RESET</strong>
            </div>

            <div class="stub-row">
                <span>SEAT</span>
                <strong>JWT-1</strong>
            </div>

            <div class="stub-row">
                <span>STATUS</span>
                <strong id="stubStatus">READY</strong>
            </div>

        </div>

    </div>

</div>

<script src="reset-password.js"></script>

</body>
</html>
