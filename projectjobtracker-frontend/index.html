<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobTracker — Boarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="boarding-pass">
    <div class="bp-header">
      <span class="bp-eyebrow">JOB TRACKER</span>
      <span class="bp-flight">BOARDING PASS</span>
    </div>

    <div class="bp-body">
      <h1 id="formTitle">Sign in</h1>
      <p class="bp-sub" id="formSub">Enter your credentials to check in.</p>

      <form id="authForm">
        <div class="field" id="nameField" style="display:none;">
          <label>Passenger name</label>
          <input type="text" id="nameInput" placeholder="Your name">
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" id="emailInput" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" id="passwordInput" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Check in</button>
      </form>

      <p class="switch-mode">
        <span id="switchText">New here?</span>
        <a href="#" id="switchLink">Create an account</a>
      </p>

      <p class="forgot-password">
        <a href="forgot-password.html">Forgot password?</a>
      </p>

      <p class="error-msg" id="errorMsg"></p>
    </div>

    <div class="bp-perforation"></div>

    <div class="bp-stub">
      <div class="stub-row"><span>GATE</span><strong>AUTH</strong></div>
      <div class="stub-row"><span>SEAT</span><strong>JWT-1</strong></div>
      <div class="stub-row"><span>STATUS</span><strong id="stubStatus">READY</strong></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
