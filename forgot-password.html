<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobTracker — Forgot Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-wrap">

    <div class="boarding-pass">

        <div class="bp-header">
            <span class="bp-eyebrow">JOB TRACKER</span>
            <span class="bp-flight">PASSWORD RESET</span>
        </div>

        <div class="bp-body">

            <h1>Forgot password?</h1>

            <p class="bp-sub">
                Enter your email and we'll send you a password reset link.
            </p>

            <form id="forgotForm">

                <div class="field">

                    <label>Email</label>

                    <input
                        type="email"
                        id="emailInput"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn-primary"
                    id="submitBtn"
                >
                    Send reset link
                </button>

            </form>

            <p class="forgot-message" id="message"></p>

            <p class="switch-mode">
                <a href="index.html">← Back to sign in</a>
            </p>

        </div>

        <div class="bp-perforation"></div>

        <div class="bp-stub">

            <div class="stub-row">
                <span>GATE</span>
                <strong>RESET</strong>
            </div>

            <div class="stub-row">
                <span>SEAT</span>
                <strong>JWT-1</strong>
            </div>

            <div class="stub-row">
                <span>STATUS</span>
                <strong id="stubStatus">READY</strong>
            </div>

        </div>

    </div>

</div>

<script src="forgot-password.js"></script>

</body>
</html>
